[project]
name = "otel-instrumentation-claude-agent-sdk-strands"
version = "0.1.0"
description = "Zero-code OpenTelemetry instrumentation for the Claude Agent SDK that emits Strands-parity telemetry parseable by Amazon Bedrock AgentCore Evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }
keywords = [
    "opentelemetry",
    "instrumentation",
    "claude-agent-sdk",
    "bedrock-agentcore",
    "evaluation",
    "strands",
]
dependencies = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-instrumentation>=0.50b0",
    "wrapt>=1.14.0",
    "claude-agent-sdk>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "opentelemetry-sdk>=1.30.0",
]

# Auto-loaded by `opentelemetry-instrument` and discoverable by BaseDistro.
[project.entry-points.opentelemetry_instrumentor]
claude-agent-sdk-strands = "otel_instrumentation_claude_agent_sdk_strands:ClaudeAgentSdkStrandsInstrumentor"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
